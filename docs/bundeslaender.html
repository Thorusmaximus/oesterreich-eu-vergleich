<!DOCTYPE html>
<html lang="de">
<head>

<title>Bundesländer | Regierungstracker Österreich</title>
<meta name="description" content="Die neun Bundesländer im Vergleich: Wirtschaft, Arbeit, Bevölkerung, Bildung und Gesundheit, mit Landesregierungen und Entwicklung über fünf Jahre.">

<meta property="og:title" content="Regierungstracker Österreich: Bundesländer">

<body>
<main>
<div class="band" aria-hidden="true"></div>
<h1><img class="logo" src="favicon.svg" alt="" width="34" height="34"> Regierungstracker Österreich</h1>
<p class="claim">Was sich verändert hat, nicht, wer schuld ist.</p>
<div class="tabs seiten" role="tablist"><a role="tab" aria-selected="false" href="index.html">Österreich</a><a role="tab" aria-selected="true" class="on" href="bundeslaender.html">Bundesländer</a></div>
<p class="frage">Wie stehen die Bundesländer da?</p>
<p class="sub">Platz unter den neun Bundesländern und Entwicklung, meist über fünf Jahre.</p>
<div id="app"><p>Lade Daten …</p></div>
</main>
<script src="bl-daten.js"></script>
<script>window.DATEN = { beispiel: !!(window.BL && window.BL.beispiel), quelle: "Eurostat", aktualisiert: (window.BL && window.BL.aktualisiert) || new Date().toISOString().slice(0,10) };</script>
<script src="common.js?v=b3f704b5"></script>
<script>
var app = document.getElementById("app"), B = window.BL, hl = "";
function fw(i, v){ return v==null ? "–" : v.toLocaleString("de-AT",{minimumFractionDigits:i.dez,maximumFractionDigits:i.dez}) + (i.suffix||"").replace(/ /g," "); }
function pille(p){ return '<span class="pt p-'+p.replace(/[^A-Za-z]/g,"")+'">'+p+'</span>'; }
function regierungen(){
  var L = B.laender.slice().sort(function(a,b){ return a.name.localeCompare(b.name,"de"); });
  var h = '<div class="card"><h2>Landesregierungen'+infoIcon("Wer in den Bundesländern regiert, mit Landeshauptperson und Koalition, darunter die Koalition der Regierungsperiode davor. Die Jahreszahl hinter der Partei ist das Jahr der letzten Landtagswahl. Stand: "+datum(B.regierungenStand)+". Das ist reine Information und fließt nicht in die Rangfolge ein.")+'</h2><div class="reg">';
  h += L.map(function(l){ var r = l.regierung;
    return '<div class="regz"><div class="regn">'+l.name+'</div><div class="regl">'+r.chef+' ('+r.partei+', '+r.wahl+')</div><div class="regk">'+r.koalition.map(pille).join(" ")+'</div>'+(r.vorher?'<div class="note regv">Davor ('+r.vorher.zeit+'): '+r.vorher.koalition.map(pille).join(" ")+(r.vorher.hinweis&&r.vorher.koalition.length<2?' <small>('+r.vorher.hinweis+')</small>'+(/Proporz/.test(r.vorher.hinweis)?infoIcon('Proporz: Alle Parteien im Landtag ab einer bestimmten Stärke bekommen automatisch Sitze in der Landesregierung, im Verhältnis zu ihrem Wahlergebnis. Es wird keine Koalition verhandelt. In Niederösterreich gilt das bis heute.'):''):'')+'</div>':'')+'<div class="note">Nächste Wahl '+r.naechsteWahl+'</div></div>';
  }).join("");
  return h + '</div></div>';
}
function gesamt(){
  var n = B.bilanz.length ? B.bilanz[0].n : 0;
  var h = '<div class="card"><h2>Gesamtbild'+infoIcon("Durchschnitt der Plätze eines Landes über alle Indikatoren mit Wertung (derzeit "+n+"). Ein niedriger Durchschnitt heißt: häufig weit vorne. Jeder Indikator zählt gleich viel. Platz 1 hat den besten Durchschnitt aller Plätze. Verglichen wird, wo ein Land steht, nicht, wie es zu der Lage kam. Indikatoren ohne Wertung (zum Beispiel Bevölkerung oder Ärzte) gehen nicht ein. Die Zahlen rechts zählen, bei wie vielen Indikatoren sich das Land in den letzten fünf Jahren verbessert (↑) oder verschlechtert (↓) hat. Das sagt nichts darüber, wer dafür verantwortlich ist.")+'</h2>';
  h += B.bilanz.map(function(b){ var l = B.laender.filter(function(x){return x.code===b.code})[0];
    return '<div class="gz'+(hl===b.code?" at":"")+'"><span><b>'+b.platz+'.</b> '+b.name+'</span><span class="note">Ø Platz '+b.durchschnittsrang.toLocaleString("de-AT",{minimumFractionDigits:1,maximumFractionDigits:1})+'</span><span class="good">'+b.besser+' ↑</span><span class="bad">'+b.schlechter+' ↓</span></div>';
  }).join("");
  return h + '</div>';
}
var PAARE_BL = [
  { titel: "Arbeitsmarkt", ids: ["arbeitslosigkeit","arbeitslosigkeitAms","beschaeftigung"], labels: ["Arbeitslos (Eurostat)","Arbeitslos (AMS)","Jobquote"] },
  { titel: "Einkommen", ids: ["bip","einkommen"], labels: ["Wirtschaftsleistung","Haushalte"] },
  { titel: "Bevölkerung", ids: ["bevoelkerung","bevoelkerung1","bevoelkerungsdichte","geburtenrate","nettozuwanderung","zuzug","wegzug"], labels: ["Wachstum 5 J.","Wachstum 1 J.","Dichte","Geburten","Netto-Zuwanderung","Zuzug","Wegzug"] },
  { titel: "Insolvenzen", ids: ["insolvenzen","insolvenzenEinwohner"], labels: ["Pro Unternehmen","Pro Einwohner"] },
  { titel: "Kaufpreise", ids: ["kaufpreise","kaufpreisWohnungen","kaufpreisHaeuser"], labels: ["Durchschnitt","Wohnungen","Häuser"] },
  { titel: "Lebenserwartung", ids: ["lebenserwartung","lebenserwartung65"], labels: ["Bei Geburt","Mit 65"] },
  { titel: "Gesundheit", ids: ["saeuglingssterblichkeit","krankenhausbetten","spitalsaufenthalte"], labels: ["Säuglinge","Betten","Aufenthalte"] },
  { titel: "Sicherheit", ids: ["straftaten","aufklaerung","verkehrstote"], labels: ["Straftaten","Aufklärung","Verkehr"] },
  { titel: "Bildung", ids: ["tertiaer","schulabbruch"], labels: ["Hochschule","Frühe Abgänger"] }
], AUSWAHL = {};
function paarBL(id){ for(var k=0;k<PAARE_BL.length;k++) if(PAARE_BL[k].ids.indexOf(id)>=0) return PAARE_BL[k]; return null; }
function kartenListe(l){
  var out = [], gesehen = {};
  l.forEach(function(i){
    var p = paarBL(i.id), v = p ? p.ids.filter(function(id){ return l.some(function(z){return z.id===id;}); }) : [];
    if(!p || v.length<2){ out.push(tile(i)); return; }
    if(gesehen[p.titel]) return; gesehen[p.titel] = true;
    var cur = AUSWAHL[p.titel] && v.indexOf(AUSWAHL[p.titel])>=0 ? AUSWAHL[p.titel] : v[0];
    var ind = l.filter(function(z){return z.id===cur;})[0];
    var tabs = '<div class="umsch">'+v.map(function(id){ return '<button type="button" data-p="'+p.titel+'" data-v="'+id+'" class="'+(id===cur?'on':'')+'">'+p.labels[p.ids.indexOf(id)]+'</button>'; }).join("")+'</div>';
    out.push(tile(ind, p.titel, tabs));
  });
  return '<div class="tiles">'+out.join("")+'</div>';
}
function tile(i, kopf, tabs){
  var L = i.laender, x = hl ? L.filter(function(z){return z.code===hl;})[0] : null, a = L[0], z = L[L.length-1];
  var t = '<div class="card tile btile"><div class="t">'+(kopf||i.name)+'</div>'+(tabs?tabs:'');
  if(x){ var fk = i.typ==='neutral' ? '' : x.rang===1 ? ' pg' : (x.rang===i.anzahl ? ' ps' : '');
    t += '<div class="r'+fk+'">Platz '+x.rang+' <small>von '+i.anzahl+'</small></div><p class="note">'+x.name+' ('+fw(i,x.wert)+')</p>';
    if(x.urteil) t += '<p class="trend '+urteilCls(x.urteil)+'"><b>'+pfeil(x.richtung)+' '+trendWort(x.urteil)+'</b> <span class="note">(seit '+(i.vorPeriode||'?')+')</span></p>';
    else if(x.richtung) t += '<p class="trend"><b>'+pfeil(x.richtung)+'</b> <span class="note">seit '+(i.vorPeriode||'?')+'</span></p>'; }
  else { var g = i.typ==='neutral' ? '' : ' pg', s = i.typ==='neutral' ? '' : ' ps'; t += '<p class="pl'+g+'"><b>Platz 1</b><br><span class="ln">'+a.name+'</span> ('+fw(i,a.wert)+')</p><p class="pl'+s+'"><b>Platz '+z.rang+'</b><br><span class="ln">'+z.name+'</span> ('+fw(i,z.wert)+')</p>'; }
  t += '<p class="note">Stand: '+periode(i.periode)+(i.typ==="neutral"?', ohne Wertung':'')+'</p>';
  return t + '<button type="button" class="more bmore" data-id="'+i.id+'">Details →</button></div>';
}
function karte(i, kopf, tabs){
  var vals = i.laender.map(function(x){return x.wert}), mn = Math.min.apply(null, vals.concat([0])), mx = Math.max.apply(null, vals.concat([0])), span = (mx-mn)||1;
  var bar = function(v){ var left=(Math.min(v,0)-mn)/span*100, w=Math.max(.8,Math.abs(v)/span*100); return '<span class="trk"><span class="bb" style="left:'+left+'%;width:'+w+'%"></span></span>'; };
  var nw = Math.max.apply(null, i.laender.map(function(x){ return fw(i,x.wert).length; })), st = ' style="--nw:'+Math.max(3.4, Math.round(nw*0.58*10)/10)+'em"';
  var lang = i.einheit.length>80; var t = '<div class="card bk"><h2>'+(kopf||i.name)+infoIcon((lang?i.einheit+'. ':'')+i.erklaerung+" Gewertet wird: "+(i.typ==="niedrig"?"ein niedrigerer Wert gilt als besser.":i.typ==="hoch"?"ein höherer Wert gilt als besser.":"nichts, der Wert hat keine Wertung.")+" "+(i.ohneTrend ? "Nur ein Jahr, deshalb ohne Trend." : i.trendInfo ? i.trendInfo : "Pfeil = Veränderung von "+(i.vorPeriode||"?")+" bis "+i.periode+", grün = besser, rot = schlechter (nur wo gewertet). Eine Veränderung unter "+(i.relativ?"3 %":fw(i,i.schwelle)+" "+i.diffEinheit)+" gilt als unverändert."))+'</h2>'+(tabs ? tabs+'<p class="note spk"><b>'+i.name+'</b>. '+(lang?'':i.einheit+'. ') : '<p class="note spk">'+(lang?'':i.einheit+'. '))+'Stand: '+periode(i.periode)+(i.typ==="neutral"?'. Ohne Wertung.':'.')+'</p>';
  t += i.laender.map(function(x){
    var pf = x.richtung ? '<span class="ta '+urteilCls(x.urteil)+'" title="'+(x.urteil?trendWort(x.urteil):"")+'">'+pfeil(x.richtung)+'</span>' : '<span class="ta"></span>';
    return '<div class="row'+(hl===x.code?" at":"")+'"'+st+'><span>'+x.rang+'. '+x.name+(x.zus?'<small class="note zs">'+x.zus+'</small>':'')+'</span>'+bar(x.wert)+'<span class="n">'+fw(i,x.wert)+'</span>'+pf+'</div>';
  }).join("");
  if(i.staedte && i.staedte.length){
    t += '<p class="note stadthead">Zum Vergleich, nicht im Ranking (Städte bzw. Stadtregionen):</p>' + i.staedte.map(function(x){
      var pf = x.richtung ? '<span class="ta '+urteilCls(x.urteil)+'" title="'+(x.urteil?trendWort(x.urteil):"")+'">'+pfeil(x.richtung)+'</span>' : '<span class="ta"></span>';
      return '<div class="row stadt"'+st+'><span>'+x.name+'<small class="note zs">'+(x.zus?x.zus+', ':'')+'würde Rang '+x.rangEinordnung+' einnehmen'+(x.periode&&x.periode!==i.periode?' (Stand '+x.periode+')':'')+'</small></span><span></span><span class="n">'+fw(i,x.wert)+'</span>'+pf+'</div>';
    }).join("");
  }
  if(i.oesterreich) t += '<p class="note">Österreich insgesamt: '+fw(i,i.oesterreich.wert)+'</p>';
  if(i.reihe) t += '<button type="button" class="verlauf" data-id="'+i.id+'">Verlauf seit '+i.reihe.jahre[0]+' anzeigen ▸</button>';
  return t + '</div>';
}
var FARBEN = ["#2b6cb0","#c05621","#2f855a","#b83280","#6b46c1","#975a16","#0987a0","#c53030","#4a5568"];
function vw(i,v){ if(v==null) return "–"; return i.reihe.einheitText ? Math.round(v).toLocaleString("de-AT") : fw(i,v); }
function verlauf(id){
  var i = B.indikatoren.filter(function(z){return z.id===id;})[0], R = i.reihe; if(!R) return;
  var W=340,H=200,L=44,Rr=8,T=10,Bt=22, all=[]; B.laender.forEach(function(l){ (R.laender[l.code]||[]).forEach(function(v){ if(v!=null) all.push(v); }); });
  var mn=Math.min.apply(null,all), mx=Math.max.apply(null,all), pad=(mx-mn)*0.08||1; mn-=pad; mx+=pad;
  var X=function(k){ return L+(W-L-Rr)*k/(R.jahre.length-1); }, Y=function(v){ return T+(H-T-Bt)*(1-(v-mn)/(mx-mn)); };
  var svg='<svg viewBox="0 0 '+W+' '+H+'" class="vsvg" role="img" aria-label="Verlauf '+i.name+'">';
  [0,.5,1].forEach(function(f){ var v=mn+(mx-mn)*f; svg+='<line x1="'+L+'" x2="'+(W-Rr)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" class="vg"/><text x="'+(L-4)+'" y="'+(Y(v)+3)+'" text-anchor="end" class="vt">'+vw(i,v)+'</text>'; });
  [0,R.jahre.length-1].forEach(function(k){ svg+='<text x="'+X(k)+'" y="'+(H-6)+'" text-anchor="'+(k?'end':'start')+'" class="vt">'+R.jahre[k]+'</text>'; });
  B.laender.forEach(function(l,n){ var pts=[]; (R.laender[l.code]||[]).forEach(function(v,k){ if(v!=null) pts.push(X(k).toFixed(1)+","+Y(v).toFixed(1)); });
    var an = hl===l.code, dim = hl && !an; svg+='<polyline points="'+pts.join(" ")+'" fill="none" stroke="'+FARBEN[n]+'" stroke-width="'+(an?3.2:1.8)+'" opacity="'+(dim?.25:1)+'"/>'; });
  svg+='</svg>';
  var leg='<div class="vleg">'+B.laender.map(function(l,n){ var arr=R.laender[l.code]||[], last=arr[arr.length-1];
    return '<span class="'+(hl===l.code?"at":"")+'"><i style="background:'+FARBEN[n]+'"></i>'+l.kurz+' <b>'+vw(i,last)+'</b></span>'; }).join("")+'</div>';
  var tab='<div class="vtab"><table><thead><tr><th></th>'+R.jahre.map(function(y){return '<th>'+y+'</th>';}).join("")+'</tr></thead><tbody>'+B.laender.map(function(l){ return '<tr'+(hl===l.code?' class="at"':'')+'><th>'+l.kurz+'</th>'+(R.laender[l.code]||[]).map(function(v){return '<td>'+vw(i,v)+'</td>';}).join("")+'</tr>'; }).join("")+'</tbody></table></div>';
  var o=document.createElement("div"); o.className="vover"; o.innerHTML='<div class="vbox" role="dialog" aria-modal="true"><button type="button" class="vzu" aria-label="Schließen">✕</button><h2>'+i.name+'</h2><p class="note">'+(R.einheitText?'Einwohner am 1. Jänner (die Karte zeigt das Wachstum in Prozent).':i.einheit)+' Verlauf '+R.jahre[0]+' bis '+R.jahre[R.jahre.length-1]+'.</p>'+svg+leg+tab+'</div>';
  o.onclick=function(e){ if(e.target===o||e.target.closest(".vzu")) o.remove(); };
  document.body.appendChild(o);
}
function detail(id){
  var i = B.indikatoren.filter(function(z){return z.id===id;})[0]; if(!i) return;
  var o=document.createElement("div"); o.className="vover"; o.innerHTML='<div class="vbox" role="dialog" aria-modal="true"><button type="button" class="vzu" aria-label="Schließen">✕</button>'+karte(i)+'</div>';
  o.onclick=function(e){ var vb=e.target.closest&&e.target.closest(".verlauf"); if(vb){ verlauf(vb.getAttribute("data-id")); return; } if(e.target===o||e.target.closest(".vzu")) o.remove(); };
  document.body.appendChild(o);
}
function seite(){
  if(!B || !B.indikatoren || !B.indikatoren.length){ app.innerHTML = '<div class="card"><p>Die Bundesländer-Daten werden beim nächsten Datenabruf geladen. Bitte später wiederkommen.</p></div>' + fussnote(); return; }
  var h = (B.beispiel ? banner() : "") + regierungen() + gesamt();
  h += '<div class="leiste"><label class="note" for="hl">Bundesland hervorheben: </label><select id="hl"><option value="">keines</option>'+B.laender.map(function(l){ return '<option value="'+l.code+'"'+(hl===l.code?" selected":"")+'>'+l.name+'</option>'; }).join("")+'</select></div>';
  var versteckt = B.indikatoren.filter(function(i){ return i.ausgeblendet; });
  B.gruppen.forEach(function(g){ var l = B.indikatoren.filter(function(i){ return i.gruppe===g && !i.ausgeblendet; }); if(!l.length) return; h += '<h2 class="gh">'+g+'</h2>'+kartenListe(l); });
  h += '<div class="card"><p class="note">Quelle: '+B.quelle+'. Die Werte liegen später vor als bei den EU-Zahlen, meist mit zwei bis drei Jahren Verzögerung, und kommen zum Teil aus Stichproben, die pro Bundesland klein sind. Der Einfachheit halber werden im Bundesländer-Vergleich alle Werte als vergleichbar betrachtet. Der Vergleich zeigt, wo ein Land steht, nicht, wer dafür verantwortlich ist. Mehr dazu in der <a href="methodik.html">Methodik</a>.</p></div>';
  if(versteckt.length) h += '<p class="note" id="ausgeblendet">Derzeit ausgeblendet, weil es noch keine Daten ab 2024 gibt: '+versteckt.map(function(i){ return i.name+' (jüngste Daten: '+periode(i.periode)+')'; }).join(', ')+'. Sie erscheinen automatisch wieder, sobald neuere Daten vorliegen.</p>';
  h += fussnote();
  app.innerHTML = h;
  app.onclick = function(e){ var mb = e.target.closest && e.target.closest(".bmore"); if(mb){ detail(mb.getAttribute("data-id")); return; } var vb = e.target.closest && e.target.closest(".verlauf"); if(vb){ verlauf(vb.getAttribute("data-id")); return; } var b = e.target.closest && e.target.closest(".umsch button"); if(!b) return; AUSWAHL[b.getAttribute("data-p")] = b.getAttribute("data-v"); var y = window.scrollY; seite(); window.scrollTo(0,y); };
  document.getElementById("hl").onchange = function(){ hl = this.value; seite(); };
}
seite();
</script>
</body>
</html>
