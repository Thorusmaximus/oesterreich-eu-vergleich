<!DOCTYPE html>

<head>

<title>Bundesländer | Regierungstracker Österreich</title>
<meta name="description" content="Die neun Bundesländer im Vergleich: Wirtschaft, Arbeit, Bevölkerung, Bildung und Gesundheit, mit Landesregierungen und Entwicklung über fünf Jahre.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-48.png" sizes="48x48" type="image/png">

<meta property="og:type" content="website">
<meta property="og:title" content="Regierungstracker Österreich: Bundesländer">
<meta property="og:description" content="Was sich verändert hat, nicht, wer schuld ist. Die neun Bundesländer im Vergleich.">
<meta property="og:image" content="https://thorusmaximus.github.io/oesterreich-eu-vergleich/vorschau.png">

</head>
<body>
<main>
<div id="neu"></div>
<div class="band" aria-hidden="true"></div>
<h1><img class="logo" src="favicon.svg" alt="" width="34" height="34"> Regierungstracker Österreich</h1>
<p class="claim">Was sich verändert hat, nicht, wer schuld ist.</p>
<div class="tabs seiten" role="tablist"><a role="tab" aria-selected="false" href="index.html">Österreich</a><a role="tab" aria-selected="true" class="on" href="bundeslaender.html">Bundesländer</a></div>
<p class="frage">Wie stehen die Bundesländer da?</p>
<p class="sub">Wer liegt vorne, wer holt auf, wer fällt zurück? Platz im Vergleich und Entwicklung in fünf Jahren.</p>
<div id="app"><p>Lade Daten …</p></div>
</main>
<script src="bl-daten.js"></script>
<script src="bl-karte.js"></script>
<script>window.DATEN = { beispiel: !!(window.BL && window.BL.beispiel), quelle: "Eurostat", aktualisiert: (window.BL && window.BL.aktualisiert) || new Date().toISOString().slice(0,10) };</script>
<script src="common.js?v=092ee4ab"></script>
<script src="bl-common.js?v=5ac0338f"></script>
<script src="bl-karte-ui.js"></script>
<script>
var app = document.getElementById("app"), B = window.BL, hl = new URLSearchParams(location.search).get("hl") || "";
function pille(p){ return '<span class="pt p-'+p.replace(/[^A-Za-z]/g,"")+'">'+p+'</span>'; }
var PROPORZ = 'Proporz: Alle Parteien im Landtag ab einer bestimmten Stärke bekommen automatisch Sitze in der Landesregierung, im Verhältnis zu ihrem Wahlergebnis. Es wird keine Koalition verhandelt. In Niederösterreich und Oberösterreich gilt das bis heute, die übrigen Länder haben es abgeschafft.';
function regierungen(){
  var L = B.laender.slice().sort(function(a,b){ return a.name.localeCompare(b.name,"de"); });
  var h = '<div class="card"><h2>Landesregierungen'+infoIcon("Wer in den Bundesländern regiert, mit Landeshauptperson und Koalition, darunter die Koalition der Regierungsperiode davor. Die Jahreszahl hinter der Partei ist das Jahr der letzten Landtagswahl. Stand: "+datum(B.regierungenStand)+". Das ist reine Information und fließt nicht in die Rangfolge ein.")+'</h2><div class="reg">';
  h += L.map(function(l){ var r = l.regierung;
    return '<div class="regz"><div class="regn">'+l.name+'</div><div class="regl">'+r.chef+' ('+r.partei+', '+r.wahl+')</div><div class="regk">'+r.koalition.map(pille).join(" ")+'</div>'+(r.hinweis?'<div class="note regv"><small>(Proporzregierung)</small>'+infoIcon(PROPORZ+' Hier: '+r.hinweis)+'</div>':'')+(r.vorher?'<div class="note regv">Davor ('+r.vorher.zeit+'): '+r.vorher.koalition.map(pille).join(" ")+(r.vorher.hinweis?(/Proporz/.test(r.vorher.hinweis)?' <small>(Proporzregierung)</small>'+infoIcon(PROPORZ+' Hier: '+r.vorher.hinweis):' <small>('+r.vorher.hinweis+')</small>'):'')+'</div>':'')+'<div class="note">Nächste Wahl '+r.naechsteWahl+'</div></div>';
  }).join("");
  return h + '</div></div>';
}
function gesamt(){
  var n = B.bilanz.length ? B.bilanz[0].n : 0;
  var h = '<div class="card"><h2>Gesamtbild'+infoIcon("Ø = Durchschnitt der Plätze eines Landes über alle Indikatoren mit Wertung (derzeit "+n+"). Ein niedriger Durchschnitt heißt: häufig weit vorne. Jeder Indikator zählt gleich viel. Platz 1 hat den besten Durchschnitt aller Plätze. Verglichen wird, wo ein Land steht, nicht, wie es zu der Lage kam. Indikatoren ohne Wertung (zum Beispiel Bevölkerung oder Ärzte) gehen nicht ein. Die Platzveränderung (▲ besser, ▼ schlechter) vergleicht mit dem Gesamtbild vor fünf Jahren, berechnet aus den damaligen Plätzen derselben Indikatoren. Die Zahlen rechts zählen, bei wie vielen Indikatoren sich das Land in den letzten fünf Jahren verbessert (↑) oder verschlechtert (↓) hat.")+'</h2>';
  h += B.bilanz.map(function(b){ var l = B.laender.filter(function(x){return x.code===b.code})[0];
    return '<div class="gz'+(hl===b.code?" at":"")+'"><span><b>'+b.platz+'.</b> '+b.name+'</span><span class="note">Ø '+b.durchschnittsrang.toLocaleString("de-AT",{minimumFractionDigits:1,maximumFractionDigits:1})+'</span><span class="note">'+(b.platzVor!=null?(b.platzVor===b.platz?'±0':(b.platzVor>b.platz?'▲ ':'▼ ')+Math.abs(b.platzVor-b.platz)):'')+'</span><span class="good">'+b.besser+' ↑</span><span class="bad">'+b.schlechter+' ↓</span></div>';
  }).join("");
  return h + '</div>';
}
var SA_OFFEN = "";
function antritt(){ return antrittTab(B.seitAntritt, "seitantritt", "Seit Regierungsantritt", false) + antrittTab(B.seitBund, "seitbund", "Seit Regierung Stocker", true); }
function antrittTab(Q, tid, titel, bund){
  if(!Q) return "";
  if(bund && Q.filter(function(a){ return !a.zuKurz; }).length < 5) return ""; // erscheint automatisch, sobald genug Daten nach dem Antritt vorliegen
  var L = Q.slice().sort(function(a,b){ return a.zuKurz-b.zuKurz || (b.besser-b.schlechter)-(a.besser-a.schlechter); });
  var h = '<div class="card" id="'+tid+'"><h2>'+titel+(bund?' <span class="note">(vorläufig)</span>':'')+infoIcon((bund ? "Wie viele Indikatoren sich seit dem Amtsantritt der Bundesregierung Stocker (ÖVP, SPÖ und NEOS, März 2025) in den einzelnen Bundesländern verbessert (↑) oder verschlechtert (↓) haben. Vorläufig: Es liegt erst ein Jahr nach dem Antritt vor, das ist nur ein Hinweis, weil Jahreswerte auch ohne Zutun schwanken. Das sagt nichts darüber, ob die Bundespolitik dafür verantwortlich ist. " : "Wie viele Indikatoren sich seit Beginn der aktuellen Landesregierung (Koalition) verbessert (↑) oder verschlechtert (↓) haben. Der Wechsel der Landeshauptperson zählt nicht. ")+" Verglichen wird das neueste Jahr mit dem Bezugsjahr: bei Beginn im ersten Halbjahr das Jahr davor, bei Beginn im zweiten Halbjahr das Jahr des Beginns, weil es zum Großteil noch die Vorgängerregierung betrifft. Es müssen mindestens "+(bund?"ein Jahr":"zwei Jahre")+" dazwischen liegen und mindestens fünf Indikatoren vorliegen, sonst steht dort „zu kurz“. Es gehen nur gewertete Indikatoren mit Zeitreihe ein. Wirtschaftsleistung und Einkommen sind nicht dabei, weil sie nominal überall steigen. Konjunktur und Bundespolitik wirken in allen Ländern. Verglichen wird, wo ein Land steht, nicht, wie es zu der Lage kam. Tippe auf ein Land für die Einzelheiten.")+'</h2>';
  h += L.map(function(a){
    var key = tid+"|"+a.code, offen = SA_OFFEN===key && !a.zuKurz;
    var z = '<div class="gz sa'+(a.zuKurz?' kurz':'')+(hl===a.code?' at':'')+'"'+(a.zuKurz?'':' data-sa="'+key+'" tabindex="0" role="button" aria-expanded="'+offen+'"')+'><span>'+a.name+'</span><span class="note">seit '+a.koalitionSeit+'</span>'+(a.zuKurz?'<span class="note sak">zu kurz</span><span></span>':'<span class="good">'+a.besser+' ↑</span><span class="bad">'+a.schlechter+' ↓</span>')+'</div>';
    if(offen){ var lk = function(l,t){ return l.length ? l.map(function(i){ return kmLink(i,t); }).join(", ") : "keine"; };
      z += '<p class="note sad"><b>Bezugsjahr '+a.basis+', Vergleich bis '+a.bis+', '+a.n+' Indikatoren ('+a.unveraendert+' unverändert).</b><br><b>Verbessert:</b> '+lk(a.besserListe,"gut")+'<br><b>Verschlechtert:</b> '+lk(a.schlechterListe,"schlecht")+'</p>'; }
    return z; }).join("");
  return h + '</div>';
}
function kartenListe(l){
  var out = [], gesehen = {};
  l.forEach(function(i){
    var p = paarBL(i.id), v = p ? p.ids.filter(function(id){ return l.some(function(z){return z.id===id;}); }) : [];
    if(!p || v.length<2){ out.push(tile(i)); return; }
    if(gesehen[p.titel]) return; gesehen[p.titel] = true;
    var cur = AUSWAHL[p.titel] && v.indexOf(AUSWAHL[p.titel])>=0 ? AUSWAHL[p.titel] : v[0];
    var ind = l.filter(function(z){return z.id===cur;})[0];
    var tabs = '<div class="umsch'+(v.length===4?' zwei':'')+'">'+v.map(function(id){ return '<button type="button" data-p="'+p.titel+'" data-v="'+id+'" class="'+(id===cur?'on':'')+'">'+p.labels[p.ids.indexOf(id)]+'</button>'; }).join("")+'</div>';
    out.push(tile(ind, p.titel, tabs));
  });
  return '<div class="tiles">'+out.join("")+'</div>';
}
function tile(i, kopf, tabs){
  var L = i.laender, x = hl ? L.filter(function(z){return z.code===hl;})[0] : null, a = L[0], z = L[L.length-1];
  var t = '<div class="card tile btile" id="f-'+i.id+'"><div class="t">'+(kopf||i.name)+'</div>'+(tabs?tabs+'<p class="note nm"><b>'+i.name+'</b></p>':'');
  if(x){ var fk = i.typ==='neutral' ? '' : x.rang===1 ? ' pg' : (x.rang===i.anzahl ? ' ps' : '');
    t += '<div class="r'+fk+'">Platz '+x.rang+' <small>von '+i.anzahl+'</small></div><p class="note">'+x.name+' <b>('+fw(i,x.wert)+')</b></p>';
    if(x.urteil) t += '<p class="trend '+urteilCls(x.urteil)+'"><b>'+pfeil(x.richtung)+' '+trendWort(x.urteil)+'</b> <span class="note">(seit '+(i.vorPeriode||'?')+')</span></p>';
    else if(x.richtung) t += '<p class="trend"><b>'+pfeil(x.richtung)+'</b> <span class="note">seit '+(i.vorPeriode||'?')+'</span></p>'; }
  else { var g = i.typ==='neutral' ? '' : ' pg', s = i.typ==='neutral' ? '' : ' ps'; t += '<p class="pl'+g+'"><b>Platz 1</b> <span class="ln">'+a.name+'</span><br><b>('+fw(i,a.wert)+')</b></p><p class="pl'+s+'"><b>Platz '+z.rang+'</b> <span class="ln">'+z.name+'</span><br><b>('+fw(i,z.wert)+')</b></p>'; }
  t += '<p class="note">Stand: '+periode(i.periode)+(i.typ==="neutral"?', ohne Wertung':'')+'</p>';
  return t + (i.reihe ? '<a class="more" href="bundesland.html?id='+encodeURIComponent(i.id)+(hl?'&hl='+hl:'')+'">Details →</a>' : '<button type="button" class="more bmore" data-id="'+i.id+'">Details →</button>') + '</div>';
}
function detail(id){
  var i = B.indikatoren.filter(function(z){return z.id===id;})[0]; if(!i) return;
  var o=document.createElement("div"); o.className="vover"; o.innerHTML='<div class="vbox" role="dialog" aria-modal="true"><button type="button" class="vzu" aria-label="Schließen">✕</button>'+karte(i)+'</div>';
  o.onclick=function(e){ if(e.target===o||e.target.closest(".vzu")) o.remove(); };
  document.body.appendChild(o);
}
function seite(){
  if(!B || !B.indikatoren || !B.indikatoren.length){ app.innerHTML = '<div class="card"><p>Die Bundesländer-Daten werden beim nächsten Datenabruf geladen. Bitte später wiederkommen.</p></div>' + fussnote(); return; }
  var h = (B.beispiel ? banner() : "") + regierungen() + gesamt() + antritt() + kmHtml();
  h += '<div class="leiste"><label class="note" for="hl">Bundesland hervorheben: </label><select id="hl"><option value="">keines</option>'+B.laender.map(function(l){ return '<option value="'+l.code+'"'+(hl===l.code?" selected":"")+'>'+l.name+'</option>'; }).join("")+'</select></div>';
  var versteckt = B.indikatoren.filter(function(i){ return i.ausgeblendet; });
  B.gruppen.forEach(function(g){ var l = B.indikatoren.filter(function(i){ return i.gruppe===g && !i.ausgeblendet; }); if(!l.length) return; h += '<h2 class="gh">'+g+'</h2>'+kartenListe(l); });
  h += '<div class="card"><p class="note">Quelle: '+B.quelle+'. Die Werte liegen später vor als bei den EU-Zahlen, meist mit zwei bis drei Jahren Verzögerung, und kommen zum Teil aus Stichproben, die pro Bundesland klein sind. Der Einfachheit halber werden im Bundesländer-Vergleich alle Werte als vergleichbar betrachtet. Der Vergleich zeigt, wo ein Land steht, nicht, wer dafür verantwortlich ist. Mehr dazu in der <a href="methodik.html">Methodik</a>. Kartengrundlage: Statistik Austria (data.statistik.gv.at), CC BY 4.0, vereinfacht von Flooh Perlot.</p></div>';
  if(versteckt.length) h += '<p class="note" id="ausgeblendet">Derzeit ausgeblendet, weil es noch keine Daten ab 2024 gibt: '+versteckt.map(function(i){ return i.name+' (jüngste Daten: '+periode(i.periode)+')'; }).join(', ')+'. Sie erscheinen automatisch wieder, sobald neuere Daten vorliegen.</p>';
  h += fussnote();
  app.innerHTML = h;
  app.onclick = function(e){ var sa = e.target.closest && e.target.closest('[data-sa]'); if(sa && !(e.target.closest('a'))){ SA_OFFEN = SA_OFFEN===sa.getAttribute('data-sa') ? '' : sa.getAttribute('data-sa'); var y0 = window.scrollY; seite(); window.scrollTo(0,y0); return; } var go0 = e.target.closest && e.target.closest('#seitantritt [data-go], #seitbund [data-go]'); if(go0){ e.preventDefault(); kmSpringe(go0.getAttribute('data-go'), go0.getAttribute('data-ton')); return; } if(e.target.closest && e.target.closest('#kmkarte')) return; var mb = e.target.closest && e.target.closest(".bmore"); if(mb){ detail(mb.getAttribute("data-id")); return; } var b = e.target.closest && e.target.closest(".umsch button"); if(!b) return; AUSWAHL[b.getAttribute("data-p")] = b.getAttribute("data-v"); var y = window.scrollY; seite(); window.scrollTo(0,y); };
  kmInit();
  document.getElementById("hl").onchange = function(){ hl = this.value; seite(); };
}
function neuesteLeiste(){
  var el=document.getElementById("neu"); if(!el || !B || !B.indikatoren) return;
  var l=B.indikatoren.filter(function(i){return !i.ausgeblendet && i.geaendert;}).sort(function(x,y){ return x.geaendert<y.geaendert?1:x.geaendert>y.geaendert?-1:0; });
  if(!l.length) return;
  var chips=l.map(function(i){ var href=i.reihe?'bundesland.html?id='+encodeURIComponent(i.id):'#'+i.id;
    return '<a class="chip" role="listitem" href="'+href+'" data-id="'+i.id+'" title="Neue Zahlen am '+datum(i.geaendert)+', Datenstand '+periode(i.periode)+'"><span class="p">'+datum(i.geaendert)+'</span> <b>'+i.name+'</b> <span class="p">('+periode(i.periode)+')</span></a>'; }).join('');
  el.innerHTML='<div class="neu" role="list" aria-label="Zuletzt aktualisiert"><div class="track">'+chips+'<span class="dup" aria-hidden="true">'+chips.replace(/<a /g,'<a tabindex="-1" ')+'</span></div></div>';
  el.onclick=function(e){ var a=e.target.closest&&e.target.closest("a.chip"); if(a && a.getAttribute("href").charAt(0)==="#"){ e.preventDefault(); detail(a.getAttribute("data-id")); } };
  var tr=el.querySelector(".track");
  if(tr && !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)){ tr.style.animationDuration=Math.max(20, Math.round(tr.scrollWidth/2/45))+"s"; tr.classList.add("lauf"); }
  else { el.firstChild.style.overflowX="auto"; }
}
function kmSpringe(id, ton){
  var p = paarBL(id); if(p) AUSWAHL[p.titel] = id;
  var y = window.scrollY; seite();
  var el = document.getElementById("f-"+id); if(!el){ window.scrollTo(0,y); return; }
  el.scrollIntoView({behavior:"smooth", block:"center"}); var kl = ton==="schlecht" ? "blitz-bad" : "blitz-good"; el.classList.add(kl); setTimeout(function(){ el.classList.remove(kl); }, 2200);
}
seite();
neuesteLeiste();
</script>
</body>
</html>
