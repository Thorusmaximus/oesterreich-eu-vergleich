<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><!-- Testphase: Suchmaschinen ignorieren die Seite. Zum Start diese Zeile löschen. -->
<title>Regierungstracker Österreich</title>
<meta name="description" content="Wie entwickelt sich Österreich seit dem Amtsantritt der Bundesregierung? Arbeitslosigkeit, Inflation, Schulden, Geburtenrate, Strompreise und mehr im Ranking der 27 EU-Länder.">
<link rel="stylesheet" href="style.css?v=8903c542">
</head>
<body>
<main>
<div id="neu"></div>
<h1 id="h1">Regierungstracker Österreich</h1>
<p class="sub" id="sub">Platz unter den EU-Ländern, pro Indikator.</p>
<div id="app"><p>Lade Daten …</p></div>
</main>
<script src="daten.js"></script>
<script src="common.js?v=eda17bd7"></script>
<script>
var app = document.getElementById("app");
if(D && D.regierung){
  document.getElementById("sub").textContent = "Entwicklung seit dem Amtsantritt der "+D.regierung.name+" am "+datum(D.regierung.start)+" ("+D.regierung.parteien+") und Platz unter den EU-Ländern.";
}
if(!D){ app.innerHTML = '<p class="bad">Keine Daten gefunden. Bitte zuerst „node update.js" ausführen.</p>'; }
else {
  var h = banner();
  var byId = {}; D.indikatoren.forEach(function(i){ byId[i.id]=i; });
  // Kombi-Kacheln: nur Indikatoren mit Daten; sie erscheinen als eine Kachel an der Stelle des ersten
  function kombiVon(i){ var p = paarFuer(i.id); if(!p) return null; var v = p.ids.filter(function(id){ return byId[id] && byId[id].oesterreich; }); return v.length>1 ? { p:p, v:v } : null; }
  function kombiKopf(i){ var k = kombiVon(i); return k.p.titel+'<div class="umsch" role="group" aria-label="Ansicht">'+k.v.map(function(id){ var n=k.p.ids.indexOf(id); return '<button type="button" data-v="'+id+'" class="'+(id===i.id?'on':'')+'">'+k.p.labels[n]+'</button>'; }).join('')+'</div>'; }
  var kachel = function(i){
    var k = '';
    if(!i.oesterreich){
      k += '<div class="card"><div class="t">'+i.name+'</div><p class="warn">Keine Daten verfügbar.</p></div>'; return k;
    }
    var a = i.oesterreich;
    if(i.art==="anteile"){
      k += '<a class="card tile" href="indikator.html?id='+encodeURIComponent(i.id)+'">'
        + '<div class="t">'+i.name+'</div>'
        + '<div class="note"><b>'+i.anteileTitel+'</b> ('+i.periode+')</div>'
        + '<div class="note" style="font-size:.95rem;line-height:1.5;color:var(--fg,inherit)">'+i.anteile.slice(0,3).map(function(x){return x.name+' <b>'+x.wert.toLocaleString("de-AT")+' %</b>';}).join('<br>')+'</div>'
        + '<div class="note">Nur Wien, kein EU-Vergleich</div>'
        + '<div class="more">Details →</div></a>';
      return k;
    }
    if(i.art==="nurAT"){
      var hj = i.halbjahr;
      k += '<a class="card tile" href="indikator.html?id='+encodeURIComponent(i.id)+'">'
        + '<div class="t">'+(kombiVon(i) ? kombiKopf(i) : i.name)+'</div>'
        + '<div class="r">'+zahl(a.wert)+' <small>Firmen '+i.periode+'</small></div>'
        + '<div class="note">Nur Österreich, kein EU-Vergleich. Höchster Wert seit '+i.ersteJahr+': Platz '+a.platzHoechste+' von '+i.anzahlJahre+' Jahren</div>'
        + '<div class="note">Stand: '+periode(i.periode)+'</div>'
        + '<div class="trend '+urteilCls(a.urteil)+'"><span class="ar" aria-hidden="true">'+pfeil(a.richtung)+'</span> Trend: '+trendWort(a.urteil)+' <span class="note">(zum Vorjahr, '+prozent(a.veraenderungProzent)+')</span></div>'
        + (hj ? '<div class="rtrend '+urteilCls(hj.urteil)+'"><span class="ar" aria-hidden="true">'+pfeil(hj.richtung)+'</span> 1. Halbjahr '+hj.jahr+': '+trendWort(hj.urteil)+' <span class="note">('+prozent(hj.veraenderungProzent)+')</span></div>' : '')
        + (i.warnung ? '<p class="warn">'+i.warnung+'</p>' : '')
      + (i.datenHinweis ? '<p class="altdaten">⏳ Neuere Eurostat-Daten noch nicht verfügbar</p>' : '')
      + (i.nachtrag ? '<p class="altdaten"><span class="flagge" role="img" aria-label="Österreich"></span> '+i.nachtrag.jahr+': '+i.nachtrag.wert.toLocaleString("de-AT")+' '+i.nachtrag.einheit+(i.nachtrag.vorjahr!=null?' (Vorjahr '+i.nachtrag.vorjahr.toLocaleString("de-AT")+')':'')+'</p>' : '')
        + '<div class="more">Details →</div></a>';
      return k;
    }
    k += '<a class="card tile" href="indikator.html?id='+encodeURIComponent(i.id)+'">'
      + '<div class="t">'+(kombiVon(i) ? kombiKopf(i) : i.name.replace('Durchschnittseinkommen','Durchschnitts-<br>einkommen'))+'</div>'
      + '<div class="r">Platz '+a.rang+' '+(i.anzahlLaender<27 ? teilPille(i) : '<small>von '+i.anzahlLaender+'</small>')+'</div>'
      + (a.bestand!=null ? '<div class="note">Einwohner: <strong>'+a.bestand.toLocaleString("de-AT",{minimumFractionDigits:2,maximumFractionDigits:2})+' Mio.</strong></div>' : '')
      + (i.art==="rating" ? '<div class="note">Durchschnitt: <strong>'+a.schnittText+'</strong> (S&amp;P, Moody\'s, Fitch)</div>' : '')
      + '<div class="note">Stand: '+(i.art==="rating" ? datum(i.stand) : periode(i.periode))+(i.veraltet ? ' (Aktualisierung fehlgeschlagen)' : '')+'</div>'
      + (a.urteil && !i.ohneTrend ? '<div class="trend '+urteilCls(a.urteil)+'"><span class="ar" aria-hidden="true">'+pfeilFuer(i,a.urteil,a.richtung)+'</span> Trend: '+trendWort(a.urteil)+' <span class="note">('+trendVergleich(i)+')</span></div>' : '')
      + (i.rangVergleich||[]).map(function(v){ if(!v) return ''; var r=rangTrend(a.rang,v.rang); return '<div class="rtrend '+urteilCls(r.u)+'"><span class="ar" aria-hidden="true">'+r.pfeil+'</span> Rang '+v.label+': Platz '+v.rang+' <span class="note">('+r.text+')</span></div>'; }).join('')
      + (i.typ==="neutral" ? '<div class="note">Rang 1 = höchster Wert</div>' : '')
      + (i.warnung ? '<p class="warn">'+i.warnung+'</p>' : '')
      + (i.datenHinweis ? '<p class="altdaten">⏳ Neuere Eurostat-Daten noch nicht verfügbar</p>' : '')
      + (i.nachtrag ? '<p class="altdaten"><span class="flagge" role="img" aria-label="Österreich"></span> '+i.nachtrag.jahr+': '+i.nachtrag.wert.toLocaleString("de-AT")+' '+i.nachtrag.einheit+(i.nachtrag.vorjahr!=null?' (Vorjahr '+i.nachtrag.vorjahr.toLocaleString("de-AT")+')':'')+'</p>' : '')
      + '<div class="more">Details →</div></a>';
  return k;
  };
  var GRUPPEN = D.gruppen || ["Wirtschaft und Arbeit","Staatsfinanzen","Preise und Kosten","Gesellschaft","Sicherheit"];
  var bilanz = function(i){ var u=i.oesterreich && i.oesterreich.urteil; return u==="besser"?"besser":u==="schlechter"?"schlechter":u==="unverändert"?"gleich":"neutral"; };
  var gruppenHtml = GRUPPEN.concat(["Weitere"]).map(function(g){
    var liste = D.indikatoren.filter(function(i){ return (i.gruppe||"Weitere")===g && !(kombiVon(i) && kombiVon(i).v[0]!==i.id); }).sort(function(a,b){ return a.name.localeCompare(b.name,"de"); });
    if(!liste.length) return "";
    var z = {besser:0, schlechter:0, gleich:0, neutral:0}; liste.forEach(function(i){ z[bilanz(i)]++; });
    var bil = '<span class="bil">'+(z.besser?'<span class="good">'+z.besser+' besser</span>':'')+(z.schlechter?'<span class="bad">'+z.schlechter+' schlechter</span>':'')+(z.gleich?'<span>'+z.gleich+' unverändert</span>':'')+(z.neutral?'<span>'+z.neutral+' ohne Wertung</span>':'')+'</span>';
    return '<section class="gruppe" data-g="'+g+'"><h2 class="gh">'+g+bil+'</h2><div class="tiles">'+liste.map(function(i){ return '<div class="kw" data-b="'+bilanz(i)+'" data-n="'+(i.name+' '+(paarFuer(i.id)?paarFuer(i.id).suche:'')).toLowerCase().replace(/"/g,'')+'">'+(function(){ var k=kombiVon(i); if(!k) return kachel(i); return k.v.map(function(id,n){ return '<div class="var" data-v="'+id+'"'+(n?' style="display:none"':'')+'>'+kachel(byId[id])+'</div>'; }).join(''); })()+'</div>'; }).join('')+'</div></section>';
  }).join('');
  h += '<div class="suche"><input type="search" id="suche" placeholder="Indikator suchen" aria-label="Indikator suchen" autocomplete="off"></div>'
  + '<div class="filter" role="group" aria-label="Filter"><button class="on" data-f="alle">Alle</button><button data-f="schlechter">Verschlechterungen</button><button data-f="besser">Verbesserungen</button><button data-f="neutral">Ohne Wertung</button></div>'
  + '<button class="fbtn" id="fbtn" aria-expanded="false" aria-controls="fbox" aria-label="Gruppen filtern"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><span>Gruppen</span><i class="fdot" id="fdot" hidden></i></button><div class="fbox" id="fbox">'
  + '<div class="filter gr" role="group" aria-label="Gruppen"><button class="on" data-g="">Alle Gruppen</button>'+GRUPPEN.map(function(g){ return '<button data-g="'+g+'">'+g+'</button>'; }).join('')+'</div></div>' + gruppenHtml;
  h += fussnote();
  app.innerHTML = h;
  neuesteLeiste();
  var fSt="alle", fGr="";
  function filtere(){
    var q = (document.getElementById("suche").value||"").trim().toLowerCase();
    document.querySelectorAll(".kw").forEach(function(w){ w.style.display = ((fSt==="alle" || w.getAttribute("data-b")===fSt) && (!q || w.getAttribute("data-n").indexOf(q)>=0)) ? "" : "none"; });
    document.querySelectorAll(".gruppe").forEach(function(s){ var gOk = !fGr || s.getAttribute("data-g")===fGr; s.style.display = gOk && s.querySelector(".kw:not([style*='none'])") ? "" : "none"; });
  }
  document.querySelectorAll(".filter").forEach(function(box){
    box.addEventListener("click", function(e){
      var b = e.target.closest("button"); if(!b) return;
      box.querySelectorAll("button").forEach(function(x){ x.classList.toggle("on", x===b); });
      if(b.hasAttribute("data-f")) fSt=b.getAttribute("data-f"); else fGr=b.getAttribute("data-g");
      filtere();
      document.getElementById("fdot").hidden = !fGr;
    });
  });
  document.getElementById("suche").addEventListener("input", filtere);
  document.addEventListener("click", function(e){
    var b = e.target.closest(".umsch button"); if(!b) return;
    e.preventDefault(); e.stopPropagation();
    var w = b.closest(".kw"), v = b.getAttribute("data-v");
    w.querySelectorAll(".var").forEach(function(d){ d.style.display = d.getAttribute("data-v")===v ? "" : "none"; });
  }, true);
  document.getElementById("fbtn").addEventListener("click", function(){
    var o = document.getElementById("fbox").classList.toggle("offen");
    this.setAttribute("aria-expanded", o ? "true" : "false");
  });
}

// Leiste über dem Titel: neueste Daten zuerst (links), mit aktuellem Trend
function periodeEnde(i){
  if(i.art==="rating"){ var d=new Date(i.stand); return d.getFullYear()*12+d.getMonth()+1+d.getDate()/32; }
  var p=String(i.periode), m;
  if((m=/^(\d{4})-(\d{2})$/.exec(p))) return +m[1]*12+ +m[2];
  if((m=/^(\d{4})-Q(\d)$/.exec(p))) return +m[1]*12+ +m[2]*3;
  if((m=/^(\d{4})-S(\d)$/.exec(p))) return +m[1]*12+ +m[2]*6;
  if((m=/^(\d{4})$/.exec(p))) return +m[1]*12+12;
  return 0;
}
function neuesteLeiste(){
  var el=document.getElementById("neu"); if(!el) return;
  var liste=D.indikatoren.filter(function(i){return i.oesterreich && i.oesterreich.urteil;}).map(function(i){
    return {i:i, g:i.geaendert||D.aktualisiert||"", e:periodeEnde(i), p:i.art==="rating"?datum(i.stand):periode(i.periode),
      ar:i.art==="nurAT"?pfeil(i.oesterreich.richtung):pfeilFuer(i,i.oesterreich.urteil,i.oesterreich.richtung)};
  }).sort(function(x,y){ return x.g<y.g ? 1 : x.g>y.g ? -1 : y.e-x.e; }); // zuletzt aktualisiert links, bei gleichem Tag der neuere Datenstand zuerst
  var chips=liste.map(function(x){
    var a=x.i.oesterreich;
    return '<a class="chip '+urteilCls(a.urteil)+'" role="listitem" href="indikator.html?id='+encodeURIComponent(x.i.id)+'" title="Neue Zahl am '+datum(x.g)+', Datenstand '+x.p+'"><span class="p">'+datum(x.g)+'</span> <b>'+x.i.name+'</b> <span class="ar" aria-hidden="true">'+x.ar+'</span> '+trendWort(a.urteil)+' <span class="p">('+x.p+')</span></a>';
  }).join('');
  // Laufband: Inhalt doppelt, damit die Schleife nahtlos läuft; Geschwindigkeit nach Länge
  el.innerHTML='<div class="neu" role="list" aria-label="Zuletzt aktualisiert"><div class="track">'+chips+'<span class="dup" aria-hidden="true">'+chips.replace(/<a /g,'<a tabindex="-1" ')+'</span></div></div>';
  var tr=el.querySelector(".track");
  if(tr && !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)){
    tr.style.animationDuration=Math.max(20, Math.round(tr.scrollWidth/2/45))+"s"; // ca. 45 Pixel pro Sekunde
    tr.classList.add("lauf");
  } else { el.firstChild.style.overflowX="auto"; }
}
</script>
</body>
</html>
