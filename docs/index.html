<script>
var app = document.getElementById("app");
// Kennzahlen ohne Daten ab 2025 sind ausgeblendet (sie erscheinen automatisch wieder, sobald es neuere Daten gibt)
var versteckt = [];
if(D && D.indikatoren){ versteckt = D.indikatoren.filter(function(i){ return i.ausgeblendet; }); D.indikatoren = D.indikatoren.filter(function(i){ return !i.ausgeblendet; }); }
if(D && D.regierung){
  (function(){
    var n = D.indikatoren.filter(function(i){ return i.oesterreich; }).length;
    var f = document.getElementById("frage");
    f.innerHTML = "Wie steht Österreich seit dem Regierungswechsel ("+datum(D.regierung.start)+") da?"+infoIcon("Amtsantritt der "+D.regierung.name+" am "+datum(D.regierung.start)+" ("+D.regierung.parteien+"). "+n+" Kennzahlen im Vergleich mit den 27 EU-Ländern. Bei einigen Kennzahlen liefern nicht alle Länder Daten, dann steht „von …“ mit der tatsächlichen Zahl der Länder. Manche gibt es nur für Österreich (etwa Insolvenzen und Verurteilungen), sie lassen sich nicht mit anderen EU-Ländern vergleichen.");
    var m = D.indikatoren.filter(function(i){ return i.oesterreich && i.laender && i.laender.length; }).length;
    document.getElementById("sub").textContent = m+" Kennzahlen, verglichen mit 27 EU-Ländern";
  })();
}
if(!D){ app.innerHTML = '<p class="bad">Keine Daten gefunden. Bitte zuerst „node update.js" ausführen.</p>'; }
else {
  var h = banner();
  var byId = {}; D.indikatoren.forEach(function(i){ byId[i.id]=i; });
  // Kombi-Kacheln: nur Kennzahlen mit Daten; sie erscheinen als eine Kachel an der Stelle des ersten
  function kombiVon(i){ var p = paarFuer(i.id); if(!p) return null; var v = p.ids.filter(function(id){ return byId[id] && byId[id].oesterreich; }); return v.length>1 ? { p:p, v:v } : null; }
  function kombiKopf(i){ var k = kombiVon(i); return k.p.titel+'<div class="umsch'+(k.v.length===4?' zwei mz':'')+'" role="group" aria-label="Ansicht">'+k.v.map(function(id){ var n=k.p.ids.indexOf(id); return '<button type="button" data-v="'+id+'" class="'+(id===i.id?'on':'')+'">'+k.p.labels[n]+'</button>'; }).join('')+'</div>'; }
  function anz(i){ var k = kombiVon(i); return (k ? k.p.titel : i.name).replace(/"/g,''); }
  var kachel = function(i){
    var k = '';
    if(!i.oesterreich){
      k += '<div class="card"><div class="t">'+i.name+'</div><p class="warn">Keine Daten verfügbar.</p></div>'; return k;
    }
    var a = i.oesterreich;
    if(i.art==="anteile"){
      k += '<a class="card tile" href="indikator.html?id='+encodeURIComponent(i.id)+'">'
        + '<div class="t">'+i.name+'</div>'
        + '<div class="note"><b>'+i.anteileTitel+'</b> ('+i.periode+')</div>'
        + '<div class="note" style="font-size:.95rem;line-height:1.5;color:var(--fg,inherit)">'+i.anteile.slice(0,3).map(function(x){return x.name+' <b>'+x.wert.toLocaleString("de-AT")+' %</b>';}).join('<br>')+'</div>'
        + '<div class="note">Nur Wien, kein EU-Vergleich</div>'
        + '<div class="more">Details →</div></a>';
      return k;
    }
    if(i.art==="verurteilungen"){
      k += '<a class="card tile" href="indikator.html?id='+encodeURIComponent(i.id)+'">'
        + '<div class="t">'+i.name+'</div>'
        + '<div class="note"><b>Verurteilte Delikte</b> ('+i.periode+', Änderung zum Vorjahr)</div>'
        + '<div class="note" style="font-size:.95rem;line-height:1.6;color:var(--fg,inherit)">'+i.delikte.map(function(d){ return '<div style="display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap"><span>'+d.name.replace('(Schwere) ','').replace('(Schwerer) ','')+'</span><span><b>'+d.wert.toLocaleString("de-AT")+'</b> <span class="'+urteilCls(d.urteil)+'"><span class="ar" aria-hidden="true">'+pfeil(d.richtung)+'</span> '+prozent(d.veraenderungProzent)+'</span></span></div>'; }).join('')+'</div>'
        + '<div class="note">Nur Österreich, kein EU-Vergleich</div>'
        + '<div class="more">Details →</div></a>';
      return k;
    }
    if(i.art==="nurAT"){
      var hj = i.halbjahr;
      k += '<a class="card tile" href="indikator.html?id='+encodeURIComponent(i.id)+'">'
        + '<div class="t">'+(kombiVon(i) ? kombiKopf(i) : i.name)+'</div>'
        + '<div class="r">'+zahl(a.wert)+' <small>Firmen '+i.periode+'</small></div>'
        + '<div class="note">Höchster Wert seit '+i.ersteJahr+': Platz '+a.platzHoechste+' von '+i.anzahlJahre+' Jahren</div>'
        + '<div class="note">Stand: '+periode(i.periode)+' '+amtsPille(i)+'</div>'
        + '<div class="trend '+urteilCls(a.urteil)+'"><span class="ar" aria-hidden="true">'+pfeil(a.richtung)+'</span> Trend: '+trendWort(a.urteil)+' <span class="note">(zum Vorjahr, '+prozent(a.veraenderungProzent)+')</span></div>'
        + (hj ? '<div class="rtrend '+urteilCls(hj.urteil)+'"><span class="ar" aria-hidden="true">'+pfeil(hj.richtung)+'</span> 1. Halbjahr '+hj.jahr+': '+trendWort(hj.urteil)+' <span class="note">('+prozent(hj.veraenderungProzent)+')</span></div>' : '')
        + (i.warnung ? '<p class="warn">'+i.warnung+'</p>' : '')
      + (i.datenHinweis ? '<p class="altdaten">⏳ Neuere Eurostat-Daten noch nicht verfügbar</p>' : '')
      + (i.nachtrag ? '<p class="altdaten"><span class="flagge" role="img" aria-label="Österreich"></span> '+i.nachtrag.jahr+': '+i.nachtrag.wert.toLocaleString("de-AT")+' '+i.nachtrag.einheit+(i.nachtrag.vorjahr!=null?' (Vorjahr '+i.nachtrag.vorjahr.toLocaleString("de-AT")+')':'')+'</p>' : '')
        + '<div class="more">Details →</div></a>';
      return k;
    }
    k += '<a class="card tile" href="indikator.html?id='+encodeURIComponent(i.id)+'">'
      + '<div class="t">'+(kombiVon(i) ? kombiKopf(i) : i.name.replace('Durchschnittseinkommen','Durchschnitts-<br>einkommen'))+'</div>'
      + '<div class="r">Platz '+a.rang+' '+(i.anzahlLaender<27 ? teilPille(i) : '<small>von '+i.anzahlLaender+'</small>')+'</div>'
      + (a.bestand!=null ? '<div class="note">Einwohner: <strong>'+a.bestand.toLocaleString("de-AT",{minimumFractionDigits:2,maximumFractionDigits:2})+' Mio.</strong></div>' : '')
      + (i.art==="rating" ? '<div class="note">Durchschnitt: <strong>'+a.schnittText+'</strong> (S&amp;P, Moody\'s, Fitch)</div>' : '')
      + '<div class="note">Stand: '+(i.art==="rating" ? datum(i.stand) : periode(i.periode))+(i.veraltet ? ' (Aktualisierung fehlgeschlagen)' : '')+' '+amtsPille(i)+'</div>'
      + (a.urteil && !i.ohneTrend ? '<div class="trend '+urteilCls(a.urteil)+'"><span class="ar" aria-hidden="true">'+pfeilFuer(i,a.urteil,a.richtung)+'</span> Trend: '+trendWort(a.urteil)+' <span class="note">('+trendVergleich(i)+')</span></div>' : '')
      + (i.rangVergleich||[]).map(function(v){ if(!v) return ''; var r=rangTrend(a.rang,v.rang); return '<div class="rtrend '+urteilCls(r.u)+'"><span class="ar" aria-hidden="true">'+r.pfeil+'</span> Rang '+v.label.replace(/^seit /,'bei ')+': Platz '+v.rang+' <span class="note">('+r.text+')</span></div>'; }).join('')
      + (i.art==="rating" ? '<div class="note">Platz bei Regierungsantritt: nicht ermittelt</div>' : '')
      + (startPlatz(i) ? '<div class="note">Platz bei Regierungsantritt: '+startPlatz(i).rang+' von '+startPlatz(i).n+'</div>' : '')
      + (i.typ==="neutral" && !i.ausgeblendet && !i.ohneTrend && a.rang!=null && !startPlatz(i) ? '<div class="note">Platz bei Regierungsantritt: nicht verfügbar</div>' : '')
      + (i.typ==="neutral" ? '<div class="note">'+(i.rangText||"Rang 1 = höchster Wert")+'</div>' : '')
      + (i.warnung ? '<p class="warn">'+i.warnung+'</p>' : '')
      + (i.datenHinweis ? '<p class="altdaten">⏳ Neuere Eurostat-Daten noch nicht verfügbar</p>' : '')
      + (i.nachtrag ? '<p class="altdaten"><span class="flagge" role="img" aria-label="Österreich"></span> '+i.nachtrag.jahr+': '+i.nachtrag.wert.toLocaleString("de-AT")+' '+i.nachtrag.einheit+(i.nachtrag.vorjahr!=null?' (Vorjahr '+i.nachtrag.vorjahr.toLocaleString("de-AT")+')':'')+'</p>' : '')
      + '<div class="more">Details →</div></a>';
  return k;
  };
  var GRUPPEN = D.gruppen || ["Wirtschaft und Arbeit","Staatsfinanzen","Preise und Kosten","Gesellschaft","Sicherheit"];
  var bilanz = function(i){ var u=i.oesterreich && i.oesterreich.urteil; if(u==null && i.oesterreich && i.typ && i.typ!=="neutral") return "gleich"; return u==="besser"?"besser":u==="schlechter"?"schlechter":u==="unverändert"?"gleich":"neutral"; };
  // Mit Wertung (Rang), aber neutralem Trend: erscheint bei "unverändert" und bei "ohne Wertung"
  // Veränderung des EU-Platzes seit Amtsantritt (nur Kennzahlen mit Wertung)
  var rangStatus = function(i){ var e = (i.rangVergleich||[]).filter(function(v){ return v && v.regierung; })[0]; if(!e || !i.oesterreich) return null; var t = rangTrend(i.oesterreich.rang, e.rang); return t ? ({besser:"rbesser", schlechter:"rschlechter"}[t.u] || "rgleich") : null; };
  var bilanzen = function(i){ var b = bilanz(i); return (b==="neutral" && i.oesterreich && i.typ && i.typ!=="neutral") ? ["gleich","neutral"] : [b]; };
  var gruppenHtml = GRUPPEN.concat(["Weitere"]).map(function(g){
    var liste = D.indikatoren.filter(function(i){ return (i.gruppe||"Weitere")===g && !(kombiVon(i) && kombiVon(i).v[0]!==i.id); }).sort(function(a,b){ return anz(a).localeCompare(anz(b),"de"); });
    var vl = versteckt.filter(function(i){ return (i.gruppe||"Weitere")===g; }).sort(function(a,b){ return anz(a).localeCompare(anz(b),"de"); });
    if(!liste.length && !vl.length) return "";
    var z = {besser:0, schlechter:0, gleich:0, neutral:0}; D.indikatoren.forEach(function(i){ if((i.gruppe||"Weitere")===g && (i.oesterreich || kombiVon(i))) bilanzen(i).forEach(function(b){ z[b]++; }); });
    var bil = '<span class="bil">'+(z.besser?'<button type="button" class="gb good" data-gf="besser" aria-pressed="false">'+z.besser+' besser</button>':'')+(z.schlechter?'<button type="button" class="gb bad" data-gf="schlechter" aria-pressed="false">'+z.schlechter+' schlechter</button>':'')+(z.gleich?'<button type="button" class="gb" data-gf="gleich" aria-pressed="false">'+z.gleich+' unverändert</button>':'')+(z.neutral?'<button type="button" class="gb" data-gf="neutral" aria-pressed="false">'+z.neutral+' ohne Wertung</button>':'')+'</span>';
    return '<section class="gruppe" data-g="'+g+'"><h2 class="gh">'+g+bil+(vl.length?'<button type="button" class="vbtn" data-t="('+vl.length+' ausgeblendet)" aria-expanded="false" title="Diese Kacheln haben noch keine Daten ab 2025">('+vl.length+' ausgeblendet)</button>':'')+'</h2>'+(vl.length?'<div class="tiles vtiles" hidden><p class="note vnote">Noch keine Daten ab 2025, daher normalerweise ausgeblendet. Sie erscheinen automatisch regulär, sobald neuere Daten vorliegen.</p>'+vl.map(function(i){ var k; try{ k=kachel(i); }catch(e){ k='<a class="card tile" href="indikator.html?id='+i.id+'"><div class="t">'+i.name+'</div><div class="note">Jüngste Daten: '+periode(i.periode)+'</div><div class="more">Details →</div></a>'; } return '<div class="vk" data-n="'+i.name.toLowerCase().replace(/"/g,'')+'">'+k+'</div>'; }).join('')+'</div>':'')+'<div class="tiles">'+liste.map(function(i){ return '<div class="kw" data-k="'+i.name.replace(/"/g,'')+'" data-a="'+anz(i)+'" data-c="'+(kombiVon(i) ? kombiVon(i).v.map(function(id){ return byId[id].geaendert||''; }).sort().pop() : (i.geaendert||''))+'" data-r="'+(kombiVon(i) ? kombiVon(i).v.map(function(id){ return rangStatus(byId[id])||''; }).join(' ') : (rangStatus(i)||''))+'" data-b="'+(kombiVon(i) ? kombiVon(i).v.map(function(id){ return bilanzen(byId[id]).join(' '); }).join(' ') : bilanzen(i).join(' '))+'" data-n="'+(i.name+' '+(paarFuer(i.id)?paarFuer(i.id).suche:'')).toLowerCase().replace(/"/g,'')+'">'+(function(){ var k=kombiVon(i); if(!k) return kachel(i); return k.v.map(function(id,n){ return '<div class="var" data-v="'+id+'" data-r="'+(rangStatus(byId[id])||'')+'" data-b="'+bilanzen(byId[id]).join(' ')+'" data-n="'+(byId[id].name+' '+id).toLowerCase().replace(/"/g,'')+'"'+(n?' style="display:none"':'')+'>'+kachel(byId[id])+'</div>'; }).join(''); })()+'</div>'; }).join('')+'</div></section>';
  }).join('');
  h += '<div class="leiste"><button class="fbtn" id="fbtn" aria-expanded="false" aria-controls="fbox" aria-label="Kennzahlengruppen filtern"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M3 6h5M14 6h7M3 12h9M18 12h3M3 18h3M12 18h9"/><circle cx="11" cy="6" r="2.4"/><circle cx="15" cy="12" r="2.4"/><circle cx="9" cy="18" r="2.4"/></svg><span>Kennzahlengruppen</span><i class="fdot" id="fdot" hidden></i></button><div class="fbox" id="fbox">'
  + '<div class="filter gr" role="group" aria-label="Kennzahlengruppen"><button class="on" data-g="">Alle Kennzahlengruppen</button><button data-g="__neu">Neue Daten</button><button data-g="__az">Alle A–Z</button>'+GRUPPEN.map(function(g){ return '<button data-g="'+g+'">'+g+'</button>'; }).join('')+'</div></div>'
  + '<div class="suche"><input type="search" id="suche" placeholder="Kennzahl suchen" aria-label="Kennzahl suchen" autocomplete="off"></div></div>' + gruppenHtml;
  h += fussnote();
  app.innerHTML = h;
  if(window.dekoriere) dekoriere(D);
  (function(){ // Flache Ansicht „Alle A–Z“: Kopien aller Kacheln, alphabetisch, ohne Gruppen
    var alle = Array.prototype.slice.call(app.querySelectorAll(".gruppe .kw")).sort(function(a,b){ return a.getAttribute("data-a").localeCompare(b.getAttribute("data-a"),"de"); });
    var sec = document.createElement("section"); sec.className = "az"; sec.id = "az"; sec.style.display = "none";
    var t = document.createElement("div"); t.className = "tiles";
    alle.forEach(function(k){ t.appendChild(k.cloneNode(true)); });
    sec.appendChild(t);
    var gr = app.querySelectorAll(".gruppe"), letzte = gr[gr.length-1];
    if(letzte) letzte.parentNode.insertBefore(sec, letzte.nextSibling); else app.appendChild(sec);
    // Ansicht „Neue Daten“: Kacheln mit neuer Zahl in den letzten 7 Tagen vor dem Datenstand, neueste zuerst
    var ende = new Date((D.aktualisiert||"")+"T12:00:00"), ab = new Date(ende.getTime()-7*864e5).toISOString().slice(0,10);
    var neu = alle.filter(function(k){ return (k.getAttribute("data-c")||"")>=ab; }).sort(function(a,b){ var x=a.getAttribute("data-c"), y=b.getAttribute("data-c"); return x<y?1:x>y?-1:a.getAttribute("data-a").localeCompare(b.getAttribute("data-a"),"de"); });
    var nd = document.createElement("section"); nd.className = "az"; nd.id = "nd"; nd.style.display = "none";
    nd.innerHTML = '<p class="note ndn">Neue Zahlen der letzten 7 Tage (bis '+datum(D.aktualisiert)+'), die neuesten zuerst.</p>';
    var t2 = document.createElement("div"); t2.className = "tiles";
    neu.forEach(function(k){ var c=k.cloneNode(true); t2.appendChild(c); });
    nd.appendChild(t2); sec.parentNode.insertBefore(nd, sec.nextSibling);
  })();
  (function(){
    // Stärken und Schwächen: Platz in den obersten bzw. untersten 5 (bis 20 Länder: 4, bis 15 Länder: 3)
    var st=[], sw=[], nst=[], nsw=[];
    D.indikatoren.concat(versteckt).forEach(function(i){
      var o=i.oesterreich, n=i.anzahlLaender; if(!o || !n || o.rang==null || !i.typ) return;
      var ohne = i.typ==="neutral" || i.trendNeutral || (!i.ausgeblendet && bilanzen(i).indexOf("neutral")>=0); // ohne Wertung; ausgeblendete gewertete Kennzahlen zählen mit
      var k = n>20 ? 5 : n>15 ? 4 : 3;
      if(o.rang<=k) (ohne?nst:st).push(i); else if(o.rang>=n-k+1) (ohne?nsw:sw).push(i);
    });
    var vis=function(l){ return l.filter(function(i){ return !i.ausgeblendet; }).length; };
    var nv=nst.length+nsw.length; // ohne Wertung
    var rel=function(i){ return i.oesterreich.rang/i.anzahlLaender; };
    st.sort(function(a,b){ return rel(a)-rel(b) || a.name.localeCompare(b.name,"de"); });
    sw.sort(function(a,b){ return rel(b)-rel(a) || a.name.localeCompare(b.name,"de"); });
    var byRel=function(a,b){ return rel(a)-rel(b) || a.name.localeCompare(b.name,"de"); };
    nst.sort(byRel); nsw.sort(function(a,b){ return byRel(b,a); });
    if(!st.length && !sw.length && !nst.length && !nsw.length) return;
    var li=function(l,ton,neu){ return l.length ? '<ul>'+l.map(function(i){ return '<li><a href="indikator.html?id='+encodeURIComponent(i.id)+'"><span>'+i.name+(i.ausgeblendet?' <small>(Daten bis '+periode(i.periode)+')</small>':(neu?' <small>(ohne Wertung)</small>':''))+'</span><b class="'+(neu?'':ton)+'">Platz '+i.oesterreich.rang+' <small>von '+i.anzahlLaender+'</small></b></a></li>'; }).join('')+'</ul>' : '<p class="note">Keine.</p>'; };
    var box=document.createElement("details"); box.className="sust";
    var SCALE='<svg class="ic" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v16M8 20h8M5 7h14"/><path d="M5 7l-3 7a3 3 0 0 0 6 0L5 7zM19 7l-3 7a3 3 0 0 0 6 0l-3-7z"/></svg>';
    box.innerHTML='<summary><span class="sk">'+SCALE+'</span><div class="stt"><h2 class="gh">Österreichs Stärken und Schwächen im EU-Vergleich'+infoIcon("Gezeigt werden Kennzahlen mit Wertung, bei denen Österreich unter den obersten bzw. untersten Plätzen liegt: bei 21 bis 27 Ländern die ersten bzw. letzten fünf, bei 16 bis 20 Ländern vier, bei 15 oder weniger drei. Kennzahlen mit Wertung zählen auch dann, wenn es noch keine Daten ab 2025 gibt (Hinweis „Daten bis 2024“). Kennzahlen ohne Wertung stehen unter „Ohne Wertung“.")+'</h2><span class="sz"><span class="sn"><b class="good">'+st.length+'</b> Stärken</span><span class="sn"><b class="bad">'+sw.length+'</b> Schwächen</span>'+(nv?'<span class="sn"><b>'+nv+'</b> ohne Wertung</span>':'')+'</span></div><span class="auf" aria-hidden="true"></span></summary><div class="sustg"><div><h3 class="good">Stärken ('+st.length+')</h3>'+li(st,"good")+'</div><div><h3 class="bad">Schwächen ('+sw.length+')</h3>'+li(sw,"bad")+'</div>'
