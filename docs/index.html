    return '<section class="gruppe" data-g="'+g+'"><h2 class="gh">'+g+bil+(vl.length?'<button type="button" class="vbtn" data-t="('+vl.length+' ausgeblendet)" aria-expanded="false" title="Diese Kacheln haben noch keine Daten ab 2025">('+vl.length+' ausgeblendet)</button>':'')+'</h2>'+(vl.length?'<div class="tiles vtiles" hidden><p class="note vnote">Noch keine Daten ab 2025, daher normalerweise ausgeblendet. Sie erscheinen automatisch regulär, sobald neuere Daten vorliegen.</p>'+vl.map(function(i){ var k; try{ k=kachel(i); }catch(e){ k='<a class="card tile" href="indikator.html?id='+i.id+'"><div class="t">'+i.name+'</div><div class="note">Jüngste Daten: '+periode(i.periode)+'</div><div class="more">Details →</div></a>'; } return '<div class="vk" data-n="'+i.name.toLowerCase().replace(/"/g,'')+'">'+k+'</div>'; }).join('')+'</div>':'')+'<div class="tiles">'+liste.map(function(i){ return '<div class="kw" data-r="'+(kombiVon(i) ? kombiVon(i).v.map(function(id){ return rangStatus(byId[id])||''; }).join(' ') : (rangStatus(i)||''))+'" data-b="'+(kombiVon(i) ? kombiVon(i).v.map(function(id){ return bilanzen(byId[id]).join(' '); }).join(' ') : bilanzen(i).join(' '))+'" data-n="'+(i.name+' '+(paarFuer(i.id)?paarFuer(i.id).suche:'')).toLowerCase().replace(/"/g,'')+'">'+(function(){ var k=kombiVon(i); if(!k) return kachel(i); return k.v.map(function(id,n){ return '<div class="var" data-v="'+id+'" data-r="'+(rangStatus(byId[id])||'')+'" data-b="'+bilanzen(byId[id]).join(' ')+'" data-n="'+(byId[id].name+' '+id).toLowerCase().replace(/"/g,'')+'"'+(n?' style="display:none"':'')+'>'+kachel(byId[id])+'</div>'; }).join(''); })()+'</div>'; }).join('')+'</div></section>';
  }).join('');
  h += '<div class="leiste"><button class="fbtn" id="fbtn" aria-expanded="false" aria-controls="fbox" aria-label="Gruppen filtern"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5L21 21"/></svg><span>Gruppen</span><i class="fdot" id="fdot" hidden></i></button><div class="fbox" id="fbox">'
  + '<div class="filter gr" role="group" aria-label="Gruppen"><button class="on" data-g="">Alle Gruppen</button>'+GRUPPEN.map(function(g){ return '<button data-g="'+g+'">'+g+'</button>'; }).join('')+'</div></div>'
  + '<div class="suche"><input type="search" id="suche" placeholder="Indikator suchen" aria-label="Indikator suchen" autocomplete="off"></div></div>' + gruppenHtml;
  h += fussnote();
  app.innerHTML = h;
  neuesteLeiste();
  (function(){
    // Stärken und Schwächen: Platz in den obersten bzw. untersten 5 (bis 20 Länder: 4, bis 15 Länder: 3)
    var st=[], sw=[], nst=[], nsw=[];
    D.indikatoren.concat(versteckt).forEach(function(i){
      var o=i.oesterreich, n=i.anzahlLaender; if(!o || !n || o.rang==null || !i.typ) return;
      var ohne = i.typ==="neutral" || bilanzen(i).indexOf("neutral")>=0; // ohne Wertung (wie im Filter „ohne Wertung“)
      var k = n>20 ? 5 : n>15 ? 4 : 3;
      if(o.rang<=k) (ohne?nst:st).push(i); else if(o.rang>=n-k+1) (ohne?nsw:sw).push(i);
    });
    var vis=function(l){ return l.filter(function(i){ return !i.ausgeblendet; }).length; };
    var nv=(st.length-vis(st))+(sw.length-vis(sw))+nst.length+nsw.length; // ohne Wertung oder ausgeblendet
    var rel=function(i){ return i.oesterreich.rang/i.anzahlLaender; };
    st.sort(function(a,b){ return rel(a)-rel(b) || a.name.localeCompare(b.name,"de"); });
    sw.sort(function(a,b){ return rel(b)-rel(a) || a.name.localeCompare(b.name,"de"); });
    var byRel=function(a,b){ return rel(a)-rel(b) || a.name.localeCompare(b.name,"de"); };
    nst.sort(byRel); nsw.sort(function(a,b){ return byRel(b,a); });

    var box=document.createElement("details"); box.className="sust";
    box.innerHTML='<summary><h2 class="gh">Österreichs Stärken und Schwächen im EU-Vergleich<span class="sz">('+vis(st)+' Stärken, '+vis(sw)+' Schwächen)</span>'+infoIcon("Gezeigt werden zunächst Indikatoren mit Wertung, bei denen Österreich unter den obersten bzw. untersten Plätzen liegt: bei 21 bis 27 Ländern die ersten bzw. letzten fünf, bei 16 bis 20 Ländern vier, bei 15 oder weniger drei. Indikatoren ohne Wertung (siehe Filter „ohne Wertung“) und ausgeblendete Indikatoren erscheinen erst nach einem Klick auf den Link darunter. Das ist eine Momentaufnahme des aktuellen Platzes. Sie sagt nichts darüber, wer dafür verantwortlich ist.")+'</h2><span class="auf" aria-hidden="true"></span></summary><div class="sustg"><div><h3 class="good">Stärken</h3>'+li(st,"good")+'</div><div><h3 class="bad">Schwächen</h3>'+li(sw,"bad")+'</div>'
      + ((nv||nst.length||nsw.length) ? '<div class="sdrit"><button type="button" class="vbtn" id="svt" aria-expanded="false">Ohne Wertung oder ausgeblendet ('+nv+')</button>'+infoIcon("Hier stehen Indikatoren, bei denen Österreich ganz vorne oder ganz hinten liegt, ohne dass das als gut oder schlecht gewertet wird (Rang 1 steht je nach Indikator für den höchsten oder den niedrigsten Wert, Details in der Kachel). Ein Klick zeigt außerdem die ausgeblendeten Indikatoren (noch keine Daten ab 2025) in den Listen links. Es gelten dieselben Grenzen wie bei Stärken und Schwächen.")+'<div class="ow">'+(nst.length?'<h3>Ohne Wertung: ganz vorne</h3>'+li(nst,"",1):'')+(nsw.length?'<h3>Ohne Wertung: ganz hinten</h3>'+li(nsw,"",1):'')+'</div></div>' : '')
      + '</div>';
    var svt=box.querySelector("#svt"); if(svt) svt.addEventListener("click", function(){ var an=box.classList.toggle("zeigv"); svt.setAttribute("aria-expanded",an?"true":"false"); svt.textContent=an?"Ohne Wertung und ausgeblendete verbergen":"Ohne Wertung oder ausgeblendet ("+nv+")"; });
    box.querySelector("summary").addEventListener("click", function(e){ if(e.target.closest(".info")) e.preventDefault(); });
    var ap=document.getElementById("app"); ap.parentNode.insertBefore(box,ap);
  })();

    el.hidden = false;

  var fSt="alle", fRk="alle", fGr="";
  function filtere(){
    var q = (document.getElementById("suche").value||"").trim().toLowerCase();
    document.querySelectorAll(".kw").forEach(function(w){
      var bs = w.getAttribute("data-b").split(" "), rs = w.getAttribute("data-r").split(" "), passt = (fSt==="alle" || bs.indexOf(fSt)>=0) && (fRk==="alle" || rs.indexOf(fRk)>=0);

      var vars = w.querySelectorAll(".var"); if(!vars.length) return;
      // Passende Variante: 1. Treffer der Suche (nach Name), 2. Wertungsfilter, 3. zuletzt gewählte (Standard: erste)
      var okF = function(v){ return (fSt==="alle" || v.getAttribute("data-b").split(" ").indexOf(fSt)>=0) && (fRk==="alle" || v.getAttribute("data-r").split(" ").indexOf(fRk)>=0); }, zeige = null;
      if(q) vars.forEach(function(v){ if(!zeige && okF(v) && v.getAttribute("data-n").indexOf(q)>=0) zeige = v; });
      if(!zeige){
        var cur = w.querySelector(".var:not([style*='none'])");
        var sel = w.getAttribute("data-sel");
        if(cur && okF(cur) && !q) zeige = cur;
        if(!zeige && sel) vars.forEach(function(v){ if(!zeige && v.getAttribute("data-v")===sel && okF(v)) zeige = v; });
        if(!zeige) vars.forEach(function(v){ if(!zeige && okF(v)) zeige = v; });
        if(!zeige) zeige = vars[0];
      }
      vars.forEach(function(v){ v.style.display = v===zeige ? "" : "none"; });
      // Umschalter: bei aktivem Wertungsfilter nur die passenden Varianten anbieten
      var ok = {}; vars.forEach(function(v){ ok[v.getAttribute("data-v")] = okF(v); });
      w.querySelectorAll(".umsch button").forEach(function(bt){ bt.style.display = ok[bt.getAttribute("data-v")] ? "" : "none"; });
    });
    var av = fSt==="ausgebl";
    document.querySelectorAll(".vtiles").forEach(function(t){
      var btn = t.closest("section").querySelector(".vbtn"), offen = btn && btn.getAttribute("aria-expanded")==="true";
      t.hidden = !(av || offen);
      t.querySelectorAll(".vk").forEach(function(k){ k.style.display = (!av || !q || k.getAttribute("data-n").indexOf(q)>=0) ? "" : "none"; });
    });
    document.querySelectorAll(".gruppe").forEach(function(s){ var gOk = !fGr || s.getAttribute("data-g")===fGr; s.style.display = gOk && (s.querySelector(".kw:not([style*='none'])") || (av && s.querySelector(".vk:not([style*='none'])"))) ? "" : "none"; });
  }
  window.__st = function(f){
    if(f.charAt(0)==="r" && f!=="rgleich" || f==="rgleich") fRk = (fRk===f ? "alle" : f); else fSt = (fSt===f ? "alle" : f);
    document.querySelectorAll(".zb").forEach(function(b){ var k = b.getAttribute("data-fz"), on = k===fSt || k===fRk; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on ? "true" : "false"); });
    filtere();
  };
  document.querySelectorAll(".filter").forEach(function(box){
    box.addEventListener("click", function(e){
      var b = e.target.closest("button"); if(!b) return;
      box.querySelectorAll("button").forEach(function(x){ x.classList.toggle("on", x===b); });
      fGr=b.getAttribute("data-g");
      filtere();
      document.getElementById("fdot").hidden = !fGr;
    });
  });
  document.getElementById("suche").addEventListener("input", filtere);
  document.addEventListener("click", function(e){
    var b = e.target.closest(".umsch button"); if(!b) return;
    e.preventDefault(); e.stopPropagation();
    var w = b.closest(".kw"), v = b.getAttribute("data-v");
    w.querySelectorAll(".var").forEach(function(d){ d.style.display = d.getAttribute("data-v")===v ? "" : "none"; });
    w.setAttribute("data-sel", v);
  }, true);
  document.getElementById("fbtn").addEventListener("click", function(){
    var o = document.getElementById("fbox").classList.toggle("offen");
    this.setAttribute("aria-expanded", o ? "true" : "false");
  });
}

// Leiste über dem Titel: neueste Daten zuerst (links), mit aktuellem Trend
function periodeEnde(i){
  if(i.art==="rating"){ var d=new Date(i.stand); return d.getFullYear()*12+d.getMonth()+1+d.getDate()/32; }
  var p=String(i.periode), m;
  if((m=/^(\d{4})-(\d{2})$/.exec(p))) return +m[1]*12+ +m[2];
  if((m=/^(\d{4})-Q(\d)$/.exec(p))) return +m[1]*12+ +m[2]*3;
  if((m=/^(\d{4})-S(\d)$/.exec(p))) return +m[1]*12+ +m[2]*6;
  if((m=/^(\d{4})$/.exec(p))) return +m[1]*12+12;
  return 0;
}
function neuesteLeiste(){
  var el=document.getElementById("neu"); if(!el) return;
  var liste=D.indikatoren.filter(function(i){return i.oesterreich && i.oesterreich.urteil;}).map(function(i){
    return {i:i, g:i.geaendert||D.aktualisiert||"", e:periodeEnde(i), p:i.art==="rating"?datum(i.stand):periode(i.periode),
      ar:i.art==="nurAT"?pfeil(i.oesterreich.richtung):pfeilFuer(i,i.oesterreich.urteil,i.oesterreich.richtung)};
  }).sort(function(x,y){ return x.g<y.g ? 1 : x.g>y.g ? -1 : y.e-x.e; }); // zuletzt aktualisiert links, bei gleichem Tag der neuere Datenstand zuerst
  var chips=liste.map(function(x){
    var a=x.i.oesterreich;
    return '<a class="chip '+urteilCls(a.urteil)+'" role="listitem" href="indikator.html?id='+encodeURIComponent(x.i.id)+'" title="Neue Zahl am '+datum(x.g)+', Datenstand '+x.p+'"><span class="p">'+datum(x.g)+'</span> <b>'+x.i.name+'</b> <span class="ar" aria-hidden="true">'+x.ar+'</span> '+trendWort(a.urteil)+' <span class="p">('+x.p+')</span></a>';
  }).join('');
  // Laufband: Inhalt doppelt, damit die Schleife nahtlos läuft; Geschwindigkeit nach Länge
  el.innerHTML='<div class="neu" role="list" aria-label="Zuletzt aktualisiert"><div class="track">'+chips+'<span class="dup" aria-hidden="true">'+chips.replace(/<a /g,'<a tabindex="-1" ')+'</span></div></div>';
  var tr=el.querySelector(".track");
  if(tr && !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches)){
    tr.style.animationDuration=Math.max(20, Math.round(tr.scrollWidth/2/45))+"s"; // ca. 45 Pixel pro Sekunde
    tr.classList.add("lauf");
  } else { el.firstChild.style.overflowX="auto"; }
}
</script>
