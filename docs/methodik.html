<script>
var app = document.getElementById("app");
if(!D){ app.innerHTML = '<p class="warn">Keine Daten gefunden.</p>'; }
else {
  var R = D.regierung, S = datum(R.start);
  var h = '<h1>Methodik</h1><p class="note">Hier steht, was die Zahlen bedeuten und nach welchen Regeln „besser“, „schlechter“ und „unverändert“ vergeben werden. Alles gilt für jede Kennzahl gleich, außer es steht bei ihr anders.</p>';

  h += '<div class="card"><h2>Grundidee</h2>'
    + '<p>Österreich wird mit den 27 EU-Ländern verglichen. Die meisten Zahlen kommen automatisch von Eurostat, dem Statistikamt der EU. Weil dort alle Länder nach denselben Regeln zählen, sind die Werte vergleichbar. Einige Kennzahlen stammen aus anderen Quellen und werden von Hand eingetragen. Die Quelle steht bei jeder Kennzahl unten in der Liste.</p>'
    + '<p>Als Vergleichszeitpunkt dient der Amtsantritt der '+R.name+' ('+R.parteien+') am '+S+'. Die Seite zeigt, <b>was sich verändert hat</b>, nicht, wer dafür verantwortlich ist. Viele Entwicklungen hängen von der Weltwirtschaft, von früheren Entscheidungen oder von Ländern und Gemeinden ab.</p></div>';

  h += '<div class="card"><h2>Rang</h2>'
    + '<p>Rang 1 ist immer der beste Wert. Bei Kennzahlen mit Wertung (zum Beispiel Arbeitslosigkeit) ist das der niedrigste oder höchste Wert, je nachdem, was als besser gilt. Bei Kennzahlen ohne Wertung (zum Beispiel Bevölkerung) steht im Fenster, was Rang 1 bedeutet. Bei gleichen Werten teilen sich Länder den Platz. Länder ohne Daten für den Zeitraum fehlen im Ranking. Dann steht „von N“ mit dem Zusatz, wie viele Länder Daten liefern.</p></div>';

  h += '<div class="card"><h2>Trend: besser, schlechter, unverändert</h2>'
    + '<p>Verglichen wird der aktuelle Wert mit dem Wert der Vorperiode. Bei Monatswerten gilt der Durchschnitt der letzten 3 Monate gegen die 3 Monate davor, damit einzelne Ausreißer nicht zählen. Bei Quartalen, Halbjahren und Jahren wird je nach Kennzahl mit der Vorperiode oder dem gleichen Zeitraum des Vorjahres verglichen. Das steht im Fenster in Klammern.</p>'
    + '<p>Ändert sich der Wert um weniger als die <b>Schwelle</b>, gilt er als „unverändert“. Darüber gilt er als „besser“ oder „schlechter“, je nachdem, in welche Richtung die Kennzahl zählt. Die Schwelle beträgt <b>3 % des aktuellen EU-Durchschnitts</b>, mindestens aber eine Einheit der letzten angezeigten Stelle (bei Prozentwerten also 0,1 Prozentpunkte). So gilt für ähnlich große Zahlen dieselbe Regel. Eine feste Schwelle gilt bei trägen Bestandsgrößen, die sich pro Jahr nur um Zehntelwerte ändern (zum Beispiel Lebenserwartung, Durchschnittsalter, Beschäftigungsquote, Einkommen, Schulden-, Staats- und Abgabenquote), beim Staatsdefizit, bei Index- und Zählwerten sowie bei Kennzahlen ohne EU-Durchschnitt. 3 % des EU-Werts wären dort zu grob. Die genaue Schwelle steht in der Liste unten. Sie ist eine Setzung, die kleine Schwankungen ausblenden soll.</p>'
    + '<p>Kennzahlen ohne Wertung zeigen nur die Richtung (steigt, sinkt) und fließen nicht in „besser“ und „schlechter“ ein.</p></div>';

  h += '<div class="card"><h2>Seit dem Amtsantritt</h2>'
    + '<p>Auf der Detailseite stehen zwei Zeilen. Die erste vergleicht Österreichs Wert bei Amtsantritt mit dem aktuellen Wert. Die zweite vergleicht diese Veränderung mit der des EU-Durchschnitts: „besser als der EU-Schnitt“ heißt, Österreich hat sich in dieser Zeit günstiger entwickelt als die EU insgesamt. Beides kann gleichzeitig verschieden ausfallen. Ein Wert kann sich verschlechtern und trotzdem besser sein als die Entwicklung im EU-Schnitt.</p>'
    + '<p>Bei Jahreswerten dient das letzte volle Jahr vor dem Amtsantritt als Ausgangspunkt. Bei Einkommen und ähnlichen Geldwerten wird mit den Preisen bereinigt (real), wo es dazugeschrieben ist.</p></div>';

  h += '<div class="card"><h2>Die Zahlen oben auf der Startseite</h2>'
    + '<p>Die Zähler oben (besser, schlechter, unverändert, ohne Wertung) zählen Kennzahlen. <b>Jede Kennzahl zählt gleich viel.</b> Das ist eine Vereinfachung: Staatsschulden und Immobilienpreise wiegen dort genauso viel wie eine kleinere Kennzahl, und zusammengelegte Fenster (zum Beispiel Median- und Durchschnittseinkommen) zählen mit jeder Kennzahl einzeln. Die Zähler sind ein Einstieg und ersetzen keine Gesamtnote. Ein Klick darauf zeigt, welche Fenster dahinterstehen.</p></div>';

  h += '<div class="card"><h2>Datenstand und Amtsantritt</h2>'
    + '<p>Statistiken erscheinen mit Verzögerung. Bei manchen Kennzahlen liegt der jüngste Wert deshalb noch vor dem Amtsantritt. Diese tragen den Vermerk <span class="lage vor">vor Amtsantritt</span> und zeigen die Lage davor, nicht die Entwicklung seither. Liegt der Datenstand im Jahr des Amtsantritts (etwa das Gesamtjahr 2025), gibt es keinen Vermerk. Der Wert enthält dann aber auch Monate vor dem 3.3.2025.</p>'
    + '<p>Gibt es von Eurostat noch keine Daten ab 2025, wird das Fenster ausgeblendet. Über den Filter „ausgeblendet“ und den Hinweis bei der jeweiligen Gruppe lässt es sich auf der Startseite trotzdem anzeigen. Wo Statistik Austria oder eine andere österreichische Quelle neuere Zahlen hat, steht sie mit österreichischer Flagge zusätzlich im Fenster. Sie fließt nicht ins Ranking ein, weil es für die anderen Länder kein Gegenstück gibt.</p></div>';

  h += '<div class="card"><h2>Bundesländer</h2>'
    + '<p>Die Seite „Bundesländer“ vergleicht die neun Länder untereinander, nicht mit der EU. Die Zahlen sind Regionaldaten von Eurostat (NUTS 2). Sie kommen meist zwei bis drei Jahre später als die nationalen Werte, und manche stammen aus Stichproben, die pro Bundesland klein sind. Der Einfachheit halber werden alle Werte als vergleichbar betrachtet, auch wenn Besonderheiten wie Pendlerströme, Tourismus oder die Lage in den Alpen sie beeinflussen.</p>'
    + '<p>Der <b>Trend</b> vergleicht den jüngsten Wert mit dem von vor fünf Jahren, für alle Länder im selben Zeitraum, unabhängig davon, wann die jeweilige Landesregierung ins Amt kam. Als Schwelle gilt wie bei den EU-Werten 3 % des österreichischen Werts, die Bevölkerung wird ohne Wertung nach Prozent verglichen.</p>'
    + '<p>Das <b>Gesamtbild</b> ist der Durchschnitt der Plätze über alle Kennzahlen mit Wertung, jeder zählt gleich viel. Es ist eine Zusammenfassung, kein Urteil über eine Landesregierung. Die Landesregierungen sind von Hand gepflegt und dienen nur der Information.</p></div>';
  h += '<div class="card"><h2>Fehler und Überprüfung</h2>'
    + '<p>Die Zahlen werden zum Teil automatisch abgerufen und zum Teil von Hand eingetragen. Trotz sorgfältiger Arbeit kann die Seite Fehler enthalten, etwa bei Zuordnungen, Rundungen oder veralteten Werten. Bitte prüfe Zahlen, die du weiterverwenden möchtest, vor der Verwendung anhand der angegebenen Originalquelle. Hinweise auf Fehler sind willkommen.</p></div>';
  h += '<div class="card"><h2>Wertungen sind Entscheidungen</h2>'
    + '<p>Ob ein höherer oder niedrigerer Wert besser ist, ist bei manchen Kennzahlen nicht eindeutig. Wo es Streit darüber gibt, steht ein Hinweis bei der Kennzahl, zum Beispiel bei Staatsquote und Abgabenquote. Manche Kennzahlen (zum Beispiel Teilzeitquote, Bevölkerung oder Durchschnittsalter) werden bewusst ohne Wertung. Die Liste unten zeigt für jede Kennzahl, wie gewertet wird.</p></div>';

  var rows = {};
  D.gruppen.forEach(function(g){ rows[g]=[]; });
  D.indikatoren.forEach(function(i){ if(rows[i.gruppe]) rows[i.gruppe].push(i); });
  h += '<h2 class="mh">Alle Kennzahlen</h2>';
  D.gruppen.forEach(function(g){
    if(!rows[g].length) return;
    h += '<div class="card"><h3>'+g+'</h3>';
    rows[g].forEach(function(i){
      var besser = i.typ==="niedrig" ? "Niedrigerer Wert" : i.typ==="hoch" ? "Höherer Wert" : "Ohne Wertung";
      var quelle = (i.art==="rating" ? "Presseberichte, Agenturen (von Hand)" : (i.quelle || D.quelle)) + (i.datensatz ? ' (Tabelle '+i.datensatz+')' : '');
      if(i.quelleUrl) quelle = '<a href="'+i.quelleUrl+'" rel="noopener">'+quelle+'</a>';
      var l = amtsLage(i);
      var stand = i.periode ? 'Stand '+periode(i.periode)+(l==="vor" ? ' <span class="lage vor">vor Amtsantritt</span>' : l==="teil" ? ' (Zeitraum enthält den Amtsantritt)' : '') : '';
      h += '<div class="mi"><a href="indikator.html?id='+encodeURIComponent(i.id)+'"><b>'+i.name+'</b></a>'
        + (i.ausgeblendet ? ' <span class="lage">ausgeblendet</span>' : '')
        + '<div class="note"><b>Besser:</b> '+besser+(i.umstritten ? ' (umstritten, siehe Hinweis bei der Kennzahl)' : '')
        + (i.schwelle!=null && i.typ!=="neutral" ? '. <b>Schwelle:</b> '+i.schwelle.toLocaleString("de-AT")+' '+(i.diffEinheit||"Prozentpunkte")+(i.schwelleArt==="relativ" ? ' (3 % des EU-Durchschnitts)' : ' (fest)') : '')
        + (i.rangText ? '. '+i.rangText : '')+'</div>'
        + '<div class="note">'+stand+(stand ? '. ' : '')+'<b>Quelle:</b> '+quelle+'</div></div>';
    });
    h += '</div>';
  });
  h += fussnote();
  app.innerHTML = h;
}
</script>
