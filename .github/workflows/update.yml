name: Daten aktualisieren
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node update.js
      - run: |
          git config user.name "daten-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/daten.js docs/daten.json docs/bl-daten.js docs/bl-daten.json
          git diff --cached --quiet || git commit -m "Daten aktualisiert"
          git push
