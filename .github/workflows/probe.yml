name: Probe
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B="https://ec.europa.eu/eurostat/api/dissemination/statistics/1.0/data"
          curl -s "$B/ilc_lvho02?format=JSON&lang=en&geo=AT&lastTimePeriod=1" > /tmp/a.json
          curl -s "$B/road_eqs_carpda?format=JSON&lang=en&geo=AT&lastTimePeriod=1" > /tmp/b.json
          curl -s "$B/road_eqs_carhab?format=JSON&lang=en&geo=AT&lastTimePeriod=1" > /tmp/c.json
          curl -s "$B/nrg_bal_c?format=JSON&lang=en&geo=AT&nrg_bal=FC_OTH_HH_E&unit=TJ&lastTimePeriod=1" > /tmp/d.json
          for f in a b c d; do echo "== $f"; python3 - $f <<'PY'
          import json,sys
          d=json.load(open('/tmp/%s.json'%sys.argv[1]))
          if 'dimension' not in d: print(str(d)[:300]); raise SystemExit
          for k in d['id']:
              c=d['dimension'][k]['category']
              print(k, {a:c.get('label',{}).get(a,a) for a in list(c['index'])[:40]} if len(c['index'])>1 else list(c['index']))
          PY
          done
